name: AI triage

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to triage (for testing)
        required: true

permissions:
  contents: read

concurrency:
  group: ai-triage-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

jobs:
  triage:
    # Optional upstream integration; disabled unless the owner explicitly opts in.
    if: vars.BLOOM_ENABLE_AI_AUTOMATIONS == 'true' && github.event.issue.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Triage issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          AUTHOR_ASSOCIATION: ${{ github.event.issue.author_association || 'CONTRIBUTOR' }}
        run: node scripts/ai-issues.mjs triage
